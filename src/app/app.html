<header class="cabecalho">
  <h1>{{ tituloModulo }}</h1>

  <nav aria-label="Caminho de navegação">
    <ol class="breadcrumb">
      <li>Início</li>
      <li aria-current="page">
        <span aria-hidden="true">›</span>
        {{ tituloModulo }}
      </li>
    </ol>
  </nav>
</header>

<main class="consulta">
  <app-filtros-lotes (pesquisaSolicitada)="pesquisar($event)" />

  @if (carregando()) {
    <p role="status">Pesquisando lotes…</p>
  } @else if (resultado(); as lotes) {
    <app-tabela-lotes [lotes]="lotes" />
  }
</main>
