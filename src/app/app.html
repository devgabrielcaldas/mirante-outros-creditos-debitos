<header class="cabecalho">
  <h1>{{ tituloModulo }}</h1>

  <nav aria-label="Caminho de navegação">
    <ol class="breadcrumb">
      <li>Início</li>
      <li aria-current="page">
        <span aria-hidden="true">›</span>
        {{ tituloModulo }}
      </li>
    </ol>
  </nav>
</header>

<main class="consulta">
  <app-filtros-lotes (pesquisaSolicitada)="pesquisar($event)" />

  <app-acoes-lote
    [lote]="tabela()?.loteSelecionado() ?? null"
    (alteracaoConfirmada)="alterarLote($event)"
    (exclusaoConfirmada)="excluirLote($event)"
    (situacaoSolicitada)="atualizarSituacao($event)"
  >
    <button class="botao-primario" type="button"
      [disabled]="inclusao.temRascunho()"
      (click)="inclusao.iniciarLote()">Incluir</button>
  </app-acoes-lote>

  <app-inclusao-lote #inclusao (loteSalvo)="aoSalvarLote($event)" />

  @if (aviso()) {
    <p role="status">{{ aviso() }}</p>
  }

  @if (carregando()) {
    <p role="status">Pesquisando lotes…</p>
  } @else if (resultado(); as lotes) {
    <app-tabela-lotes [lotes]="lotes" />
  }
</main>
